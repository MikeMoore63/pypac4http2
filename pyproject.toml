[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pypac4http2"
version = "0.1.0"
description = "Python package which builds on pypac to add pac file support for httplib2 Http"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mike Moore", email = "z_z_zebra@yahoo.com"}
]
dependencies = [
    "httplib2>=0.22.0",
    "pypac>=0.17.0",
    "PySocks>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "tox>=4.0",
]

[project.scripts]
pypac4http2 = "pypac4http2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["pypac4http2"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
